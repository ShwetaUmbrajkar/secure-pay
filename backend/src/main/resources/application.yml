server:
  port: 8080

spring:
  application:
    name: secure-pay-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securepay}
    username: ${DB_USER:securepay}
    password: ${DB_PASSWORD:securepay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true # let Hibernate create tables before data.sql runs

  sql:
    init:
      mode: always # run data.sql (demo seed account) against Postgres, not just embedded DBs

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: secure-pay-fraud-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.securepay.dto"

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-please}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  kafka:
    fraud-topic: fraud-alerts
  fraud:
    amount-threshold: ${FRAUD_AMOUNT_THRESHOLD:100000}
  ai-agent:
    base-url: ${AI_AGENT_URL:http://localhost:8000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
